{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argo-workflows.serviceAccountName" . }}
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argo-workflows.serviceAccountName" . }}-server
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
