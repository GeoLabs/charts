apiVersion: v1
kind: Service
metadata:
  name: argo-server
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.argo.workflows.server.service.type }}
  ports:
  - name: web
    port: {{ .Values.argo.workflows.server.service.port }}
    targetPort: 2746
    protocol: TCP
  selector:
    app: argo-server
    {{- include "argo-workflows.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-controller-metrics
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: workflow-controller
    {{- include "argo-workflows.selectorLabels" . | nindent 4 }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: argo-server-metrics
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 2746
    targetPort: 2746
    protocol: TCP
  selector:
    app: argo-server
    {{- include "argo-workflows.selectorLabels" . | nindent 4 }}
{{- end }}
