apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-controller
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-controller
      {{- include "argo-workflows.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: workflow-controller
        {{- include "argo-workflows.controller.labels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "argo-workflows.serviceAccountName" . }}
      containers:
      - name: workflow-controller
        image: "quay.io/argoproj/workflow-controller:v{{ .Values.argo.workflows.version }}"
        imagePullPolicy: IfNotPresent
        command:
        - workflow-controller
        args:
        - --configmap=workflow-controller-configmap
        - --executor-image=quay.io/argoproj/argoexec:v{{ .Values.argo.workflows.version }}
        - --namespaced={{ .Values.argo.workflows.controller.namespaced }}
        {{- if .Values.argo.workflows.controller.namespaced }}
        - --managed-namespace={{ include "argo-workflows.namespace" . }}
        {{- end }}
        - --loglevel=info
        - --gloglevel=6
        env:
        - name: ARGO_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: LEADER_ELECTION_IDENTITY
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: telemetry
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6060
          initialDelaySeconds: 90
          periodSeconds: 60
          timeoutSeconds: 30
        resources:
          {{- toYaml .Values.argo.workflows.controller.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
