{{- if .Values.argo.events.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sa
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.events.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-role
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.events.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  - apiGroups: [ "argoproj.io" ]
    resources: [ "sensors", "sensors/finalizers", "sensors/status", "eventsources", "eventsources/finalizers", "eventsources/status", "eventbus", "eventbus/finalizers", "eventbus/status" ]
    verbs: [ "create", "delete", "deletecollection", "get", "list", "patch", "update", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "pods", "pods/exec", "configmaps", "services", "persistentvolumeclaims" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "get", "update", "list", "patch", "delete" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "statefulsets" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-role-binding
  namespace: {{ include "argo-workflows.namespace" . }}
  labels:
    {{- include "argo-workflows.events.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-role
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: {{ include "argo-workflows.namespace" . }}
{{- end }}
