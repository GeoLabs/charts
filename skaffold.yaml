apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: zoo-project-dru-minikube-deployment
deploy:
  helm:
    releases:

    # Install Zoo Project DRU
    - name: zoo-project-dru
      chartPath: zoo-project-dru
      namespace: zoo
      createNamespace: true
      valuesFiles:
      - zoo-project-dru/values_minikube.yaml

    hooks:
      after:
        - host:
            command: ["sh", "-c", "./wait-for-it.sh"]
            os: [darwin, linux]

profiles:

  - name: hostpath
    patches:
      - op: replace
        path: /deploy/helm/releases/0/valuesFiles
        value: [zoo-project-dru/values_apple.yaml]

  - name: webui
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates
        value:
          webui.enabled: "true"
    portForward:
      - resourceType: service
        resourceName: zoo-project-dru-webui
        namespace: zoo
        port: 3000
        localPort: 3058
      - resourceType: service
        resourceName:	zoo-project-dru-service
        namespace: zoo
        port: 80
        localPort: 8080
      - resourceType: service
        resourceName:	zoo-project-dru-websocketd
        namespace: zoo
        port: 8888
        localPort: 8888
      - resourceType: service
        resourceName: s3-service
        namespace: zoo 
        port: 9000 
        localPort: 9000 
      - resourceType: service
        resourceName: s3-service
        namespace: zoo 
        port: 9001 
        localPort: 9001

  - name: argo
    patches:
      - op: replace
        path: /deploy/helm/releases/0/valuesFiles
        value: ["zoo-project-dru/values_argo.yaml"]
    portForward:
      # Argo Workflows Server
      - resourceType: service
        resourceName: argo-server
        namespace: zoo
        port: 2746
        localPort: 2746
      # Prometheus
      - resourceType: service
        resourceName: zoo-project-dru-kube-prome-prometheus
        namespace: zoo
        port: 9090
        localPort: 9090
      # Grafana  
      - resourceType: service
        resourceName: zoo-project-dru-grafana
        namespace: zoo
        port: 80
        localPort: 3000
      # PostgreSQL (for debugging)
      - resourceType: service
        resourceName: zoo-project-dru-postgresql
        namespace: zoo
        port: 5432
        localPort: 5432
      # RabbitMQ Management (for debugging)
      - resourceType: service
        resourceName: zoo-project-dru-rabbitmq
        namespace: zoo
        port: 15672
        localPort: 15672
      # Redis (for debugging)
      - resourceType: service
        resourceName: zoo-project-dru-redis-master
        namespace: zoo
        port: 6379
        localPort: 6379
      - resourceType: service
        resourceName:	zoo-project-dru-service
        namespace: zoo
        port: 80
        localPort: 8080
      - resourceType: service
        resourceName:	zoo-project-dru-websocketd
        namespace: zoo
        port: 8888
        localPort: 8888
      - resourceType: service
        resourceName: s3-service
        namespace: zoo 
        port: 9000 
        localPort: 9000 
      - resourceType: service
        resourceName: s3-service
        namespace: zoo 
        port: 9001 
        localPort: 9001

portForward:

# Zoo Project services
# The following port forward is used to access the webui
# - resourceType: service
#   resourceName:	zoo-project-dru-webui
#   namespace: zoo
#   port: 3000
#   localPort: 3058
- resourceType: service
  resourceName:	zoo-project-dru-service
  namespace: zoo
  port: 80
  localPort: 8080
- resourceType: service
  resourceName:	zoo-project-dru-websocketd
  namespace: zoo
  port: 8888
  localPort: 8888
- resourceType: service
  resourceName: s3-service
  namespace: zoo 
  port: 9000 
  localPort: 9000 
- resourceType: service
  resourceName: s3-service
  namespace: zoo 
  port: 9001 
  localPort: 9001